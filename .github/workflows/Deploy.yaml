
name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip CI checks for an emergency deployment"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Prevent concurrent production deployments.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, Test and Validate
    runs-on: ubuntu-latest

    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate server syntax
        run: |
          if [ -f server.js ]; then
            node --check server.js
          else
            echo "ERROR: server.js not found"
            exit 1
          fi

      - name: Run tests if configured
        run: npm run test --if-present

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: ci

    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (
        needs.ci.result == 'success' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.skip_tests == true &&
          needs.ci.result == 'skipped'
        )
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.0.3

        env:
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 30s
          command_timeout: 15m

          envs: COMMIT_SHA,ACTOR

          script: |
            set -Eeuo pipefail

            trap 'rc=$?; echo "ERROR: Deployment failed at line $LINENO (exit $rc)"; exit "$rc"' ERR

            echo "=========================================="
            echo "Production deployment starting"
            echo "Commit: ${COMMIT_SHA}"
            echo "Triggered by: ${ACTOR}"
            date
            echo "=========================================="

            # 1. Load Node.js installed through NVM.
            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            if ! command -v node >/dev/null 2>&1 ||
               ! command -v npm >/dev/null 2>&1; then
              echo "ERROR: Node.js or npm is unavailable."
              exit 1
            fi

            echo "Node: $(node -v)"
            echo "NPM:  $(npm -v)"

            # 2. Locate the application.
            APP_DIR="$HOME/first/first"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: Git repository not found at $APP_DIR"
              echo "Update APP_DIR to the actual repository location."
              exit 1
            fi

            cd "$APP_DIR"

            # 3. Synchronize with production branch.
            # WARNING: This discards tracked local changes.
            echo "Fetching latest main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "Deployed source commit: $(git rev-parse HEAD)"

            # 4. Install dependencies, including build tools.
            if [ ! -f package.json ]; then
              echo "ERROR: package.json is missing."
              exit 1
            fi

            if [ ! -f package-lock.json ]; then
              echo "ERROR: package-lock.json is missing."
              exit 1
            fi

            echo "Installing locked dependencies..."
            npm ci --no-audit --prefer-offline

            # 5. Build before changing the running process.
            echo "Running production build if configured..."
            npm run build --if-present

            # 6. Ensure PM2 is available.
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "PM2 not found. Installing for this SSH user..."
              npm install -g pm2
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "ERROR: PM2 is still unavailable."
              exit 1
            fi

            echo "PM2 version: $(pm2 --version)"
            pm2 list

            # 7. Start or reload the application.
            if [ -f ecosystem.config.cjs ]; then
              echo "Using ecosystem.config.cjs..."
              pm2 startOrReload ecosystem.config.cjs \
                --env production \
                --update-env

            elif [ -f server.js ]; then
              echo "Using server.js with PM2 process name 'app'..."

              if pm2 describe app >/dev/null 2>&1; then
                pm2 reload app --update-env
              else
                pm2 start server.js --name app --time
              fi

            else
              echo "ERROR: No supported application entry point found."
              exit 1
            fi

            # 8. Persist PM2 process configuration.
            pm2 save
            pm2 list

            # 9. Verify application health.
            # Your application must implement GET /health with HTTP 200.
            HEALTH_URL="http://127.0.0.1:3000/health"
            MAX_RETRIES=10
            SUCCESS=0

            echo "Checking $HEALTH_URL..."

            for i in $(seq 1 "$MAX_RETRIES"); do
              HTTP_CODE="$(
                curl --silent --output /dev/null \
                  --max-time 5 \
                  --write-out '%{http_code}' \
                  "$HEALTH_URL" || true
              )"

              echo "Health check $i/$MAX_RETRIES: HTTP ${HTTP_CODE:-000}"

              if [ "$HTTP_CODE" = "200" ]; then
                SUCCESS=1
                break
              fi

              sleep 3
            done

            if [ "$SUCCESS" -ne 1 ]; then
              echo "ERROR: Application health check failed."
              pm2 list
              pm2 logs --lines 50 --nostream || true
              exit 1
            fi

            # 10. Production dependency cleanup after successful build.
            # Do not remove build tools before building.
            # Keep dev dependencies if the running app requires them.

            echo "=========================================="
            echo "Deployment and health check succeeded."
            echo "Commit: ${COMMIT_SHA}"
            echo "=========================================="
